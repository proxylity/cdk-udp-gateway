name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
