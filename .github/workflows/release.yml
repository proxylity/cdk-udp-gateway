name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Sync version to release tag
        run: npm version "${{ github.event.release.tag_name }}" --no-git-tag-version --allow-same-version
      - name: Compile
        run: npm run compile
      - name: Package (jsii-pacmak -> js/python/dotnet)
        run: npm run package
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-npm:
    needs: build
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish dist/js/*.tgz --provenance --access public

  publish-pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/python

  publish-nuget:
    needs: build
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: NuGet login (exchange OIDC token for short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        run: dotnet nuget push dist/dotnet/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
