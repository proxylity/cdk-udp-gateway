version: 0.2

env:
  shell: bash
  # Publish credentials are referenced ONLY as parameter-store / secrets-manager placeholders — never
  # literal secrets. The real CodeBuild project wires these to the actual stores. `publish.sh` is a
  # scripted stub in this repo (it echoes what it would publish and exits 0); flip the per-registry
  # steps on in that script once the credentials below are provisioned.
  parameter-store:
    NPM_REGISTRY: /proxylity/publish/NPM_REGISTRY
    PYPI_REPOSITORY_URL: /proxylity/publish/PYPI_REPOSITORY_URL
    NUGET_SOURCE: /proxylity/publish/NUGET_SOURCE
    MAVEN_REPOSITORY_URL: /proxylity/publish/MAVEN_REPOSITORY_URL
    GO_MODULE_PROXY: /proxylity/publish/GO_MODULE_PROXY
  secrets-manager:
    NPM_TOKEN: PROXYLITY_PUBLISH:NPM_TOKEN
    PYPI_TOKEN: PROXYLITY_PUBLISH:PYPI_TOKEN
    NUGET_API_KEY: PROXYLITY_PUBLISH:NUGET_API_KEY
    MAVEN_USERNAME: PROXYLITY_PUBLISH:MAVEN_USERNAME
    MAVEN_PASSWORD: PROXYLITY_PUBLISH:MAVEN_PASSWORD

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
  build:
    on-failure: ABORT
    commands:
      - scripts/publish.sh
