version: 0.2

env:
  shell: bash

phases:
  install:
    on-failure: ABORT
    # jsii-pacmak builds all five language artifacts, so the packaging stage needs each language's
    # toolchain available in the CodeBuild image (Node for npm/jsii, Python for the wheel/sdist,
    # .NET for the NuGet package, Java/Maven for the Maven artifact, and Go for the Go module).
    runtime-versions:
      nodejs: 20
      python: 3.12
      dotnet: 8.0
      java: corretto21
      golang: 1.21
  build:
    on-failure: ABORT
    commands:
      - scripts/package.sh

artifacts:
  base-directory: dist
  files:
    - '**/*'
