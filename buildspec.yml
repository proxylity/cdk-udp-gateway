version: 0.2
env:
  shell: /bin/bash

batch:
  fast-fail: false
  build-graph:
    - identifier: checks
      buildspec: build/checks.yml
      ignore-failure: false
    - identifier: package
      depend-on:
        - checks
      ignore-failure: false
      buildspec: build/package.yml
    - identifier: publish
      depend-on:
        - package
      ignore-failure: false
      buildspec: build/publish.yml

phases:
  build:
    on-failure: ABORT
    commands:
      - echo "Ziggy was here."
